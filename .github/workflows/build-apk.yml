name: MIMO Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mimo-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Backend contract tests
        run: node --test backend/*.test.mjs
      - name: Generate Android project
        run: flutter create --platforms android --project-name mimo_ai --org com.mimoai .
      - name: Configure permissions
        run: python3 scripts/configure_android.py
      - name: Build Blender avatar asset
        run: |
          curl -fsSL https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          tar --no-same-owner -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/blender-4.3.2-linux-x64/blender" -b -t 2 --python-exit-code 1 -P scripts/create_avatar.py -- --output assets/avatar
          python3 scripts/validate_avatar.py assets/avatar/mimo-head.glb
          test -s assets/avatar/mimo-head.glb
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze application
        run: flutter analyze lib test
      - name: Verify face states
        run: flutter test
      # Test APK fallback. Cache eviction can change this key; use the repository
      # secret below for a durable identity across future builds.
      - name: Restore test signing identity
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mimo-test-signing-v1
      - name: Load durable signing identity when configured
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.MIMO_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build Android APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: mimo-ai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
      - name: Publish one download page
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          TAG="v${VERSION}-build.${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-debug.apk mimo-ai.apk
          gh release create "$TAG" mimo-ai.apk assets/avatar/mimo-portrait.png assets/avatar/mimo-speaking.png --target "$GITHUB_SHA" --title "MİMO ${VERSION} · ${{ github.run_number }}" --notes-file RELEASE_NOTES.md
