name: MIMO Blender avatar
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/create_avatar.py', 'assets/source/**', '.github/workflows/render-avatar.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          curl -fsSL https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          tar --no-same-owner -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Render portrait and export mobile model
        run: |
          "$RUNNER_TEMP/blender-4.3.2-linux-x64/blender" -b -t 2 --python-exit-code 1 -P scripts/create_avatar.py -- --output avatar-build
          python3 scripts/validate_avatar.py avatar-build/mimo-head.glb
          test -s avatar-build/mimo-head.glb
          test -s avatar-build/mimo-head.blend
          test -s avatar-build/mimo-portrait.png
          test -s avatar-build/mimo-speaking.png
      - uses: actions/upload-artifact@v4
        with:
          name: mimo-blender-avatar
          path: avatar-build/
          retention-days: 30
          if-no-files-found: error
