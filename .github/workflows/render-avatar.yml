name: MIMO Blender avatar
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/create_avatar.py', '.github/workflows/render-avatar.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
      - name: Render portrait and export mobile model
        run: blender -b -t 2 -P scripts/create_avatar.py -- --output avatar-build
      - uses: actions/upload-artifact@v4
        with:
          name: mimo-blender-avatar
          path: avatar-build/
          retention-days: 30
